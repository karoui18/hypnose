<!doctype html>
<html lang="fr" data-access-page>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrer au cabinet — Le Cabinet d’Hypnose</title>
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/interactive.css">
  <script src="js/guard.js"></script>
</head>
<body class="access-page">
  <main class="victorian-card access-card">
    <img class="lock-engraving" src="assets/cadenas-we00354f039d-60a5cbd4.jpg" alt="">
    <p class="eyebrow">Le Cabinet d’Hypnose</p>
    <h1>La clé du cabinet</h1>
    <p>Cet espace est réservé aux personnes disposant du mot de passe.</p>
    <img class="ornament" src="assets/courbe-art-nouveau-ae508b87.jpg" alt="">
    <form id="access-form">
      <label for="password">Votre mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="access-error">
      <label class="show-password"><input id="show-password" type="checkbox">Afficher le mot de passe</label>
      <p id="access-error" class="error-message" role="alert"></p>
      <button class="ink-button" type="submit">Entrer au cabinet</button>
    </form>
    <noscript><p>Activez JavaScript pour saisir le mot de passe et utiliser les questionnaires.</p></noscript>
    <p class="access-caption">Sébastien Occhipinti · Épernon</p>
  </main>
</body>
</html>
